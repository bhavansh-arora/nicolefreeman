  <script>
    /* Runs before anything is drawn. First visit this session: brand intro.
       Arriving from a link on this site: the page-transition reveal.
       Both are CSS animations that finish on their own. */
    (function (d) {
      d.classList.add('js');
      try {
        var s = sessionStorage, rm = matchMedia('(prefers-reduced-motion: reduce)').matches;
        if (!rm) {
          if (s.getItem('nf_nav')) d.classList.add('nf-in');
          else if (!s.getItem('nf_seen')) d.classList.add('nf-intro');
        }
        s.removeItem('nf_nav');
        s.setItem('nf_seen', '1');
      } catch (e) {}
    })(document.documentElement);
  </script>
  <script type="speculationrules">{"prefetch":[{"where":{"href_matches":"/*.html"},"eagerness":"moderate"}]}</script>
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "ProfessionalService",
    "name": "Nicole Freeman Coaching",
    "url": "https://nicolefreeman.co.uk/",
    "image": "https://nicolefreeman.codebunny.net/assets/img/og-nicole-freeman.jpg",
    "logo": "https://nicolefreeman.codebunny.net/assets/img/icon-512.png",
    "telephone": "+44 7976 268520",
    "email": "nicole@nicolefreeman.co.uk",
    "address": { "@type": "PostalAddress", "addressLocality": "London", "addressCountry": "GB" },
    "areaServed": ["London", "United Kingdom", "Worldwide (Zoom)"],
    "founder": { "@type": "Person", "name": "Nicole Freeman", "jobTitle": "Mindset coach (PCC) and clinical hypnotherapist", "sameAs": ["https://www.linkedin.com/in/nicole-freeman-coaching/", "https://www.instagram.com/nicolefreemancoaching/", "https://www.facebook.com/nicolefreemancoach/"] },
    "slogan": "You don't have to be perfect to be amazing."
  }
  </script>

<body data-page="{{page.nav}}">

    <div class="intro__inner">
      <span class="intro__brand">{{mark}} Nicole Freeman · Coaching</span>
      <p class="intro__words"><span class="iw"><span>Ditch</span></span> <span class="iw"><span>the</span></span> <span class="iw iw--x"><span><em>doubt.</em><i></i></span></span></p>

    <span class="intro__bar"><i></i></span>
  </div>

  <div class="pt" aria-hidden="true">
    <div class="pt__layer pt__layer--fizz"></div>
    <div class="pt__layer pt__layer--ink">
      <div class="pt__label">
        <span class="pt__kick">{{mark}} Nicole Freeman · Coaching</span>
        <span class="pt__title">Nicole <em>Freeman</em></span>
      </div>
    </div>
  </div>
  <script>
    window.NF_PT = { "index": "Ditch the <em>doubt</em>", "about": "Meet <em>Nicole</em>", "coaching": "Coaching <em>&amp; hypnotherapy</em>", "mindset-mot": "Your Mindset <em>MOT</em>", "supervision": "Supervision <em>&amp; teams</em>", "kind-words": "Kind <em>words</em>", "contact": "Let's <em>chat</em>", "404": "Wrong <em>turn</em>" };
    (function () { var k = (location.pathname.split('/').pop() || 'index').replace('.html', '') || 'index'; var t = document.querySelector('.pt__title'); if (t && window.NF_PT[k]) t.innerHTML = window.NF_PT[k]; })();
  </script>

  {{> header}}

  <main id="main">
{{BODY}}
  </main>

  {{> footer}}

  <script src="assets/js/config.js" defer></script>
